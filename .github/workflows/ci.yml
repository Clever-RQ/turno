name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      # Compila igual que Vercel: detecta errores que lint/typecheck/test no ven
      # (por ejemplo, datos de la petición fuera de <Suspense> con cacheComponents).
      - run: npm run build
